<div class="page-center">
  <div class="details">
      <img src="{{student.profile_picture}}" alt="">
      <p><b>Student Name:</b> {{student.name}}</p>
      <p><b>School Name:</b> {{student.school_name}}</p>
      <p><b>School Address:</b> {{student.school_city}} {{student.school_pin}}</p>
      <p><b>Phone:</b> {{student.phone}}</p>
      <p><b>DOB:</b> {{student.dob}}</p>
      <p><b> Student City:</b> {{student.city}}</p>
      <p><b>Email:</b> {{student.email}}</p>
      <p><b>Id:</b> {{student.id}}</p>
  </div>
</div>
