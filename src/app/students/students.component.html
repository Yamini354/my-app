
<div class="divtop">
        <input type="text" placeholder="search"[(ngModel)]="term" >
        <button (click)="getStudentsWithParams()" >Search</button>
        <label for="">Column</label>
        <select name="" id="" [(ngModel)]="column">
            <option value="school_name">School Name</option>
            <option value="school_city">School City</option>
            <option value="name">Student Name</option>
            <option value="city">Student City</option>
        </select>

        <label for="">Order</label>
        <select name="" id=""[(ngModel)]="order">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
        </select>
        <button (click)="getStudentsWithParams()">Sort</button>
        <!-- <button routerLink="/dashboard/create-student">New Student Details</button> -->
    </div>
<div class="container">
    
    <div *ngFor="let student of students" class="card">
        <div class="top">
         <img [src]="student.school_logo" alt="">
            <h1>{{student.school_name}}</h1><br>
            <p>City: {{student.school_city}}-{{student.school_pin}}</p>
        </div>
        <div class="middle">
            <div class="middleLeft">
                <p>Name: {{student.name}}</p>
                <p>Phone No: {{student.phone}}</p>
                <p>DOB: {{student.dob}}</p>
                <p>City: {{student.city}}</p>
                <p>Email: {{student.email}}</p>
                <p>{{student.id}}</p>
            </div>
            <div class="middleRight">
                <img [src]="student.profile_picture" alt="">
            </div>
        </div>
        <div class="bottom">
            <button class="view" routerLink="/dashboard/student-details/{{student.id}}" >View</button>
            <button class="edit" routerLink="/dashboard/edit-student/{{student.id}}">Edit</button>
            <button (click)="deleteStudent(student.id)">Delete</button>
        </div>
    </div>
</div>
<div class="pagination">
    <button
        class="green-button"
        (click)="getStudentsWithParams(i+1)"
        *ngFor="let page of [].constructor(10); let i=index"
    >
    {{i+1}}</button>
</div>
